# Системы Порядок — конфигурация nginx.
#
# На сервере лежит как /etc/nginx/sites-available/default
# и включён ссылкой из /etc/nginx/sites-enabled/.
#
# Здесь хранится образец, чтобы конфиг не жил в единственном экземпляре
# на живом сервере. Порядок обновления — в DEPLOY.md.

# ── 1. HTTPS: Django через gunicorn ──────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    server_name s-poryadok.ru www.s-poryadok.ru;

    # Сертификаты Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/s-poryadok.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s-poryadok.ru/privkey.pem;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Файл /etc/letsencrypt/options-ssl-nginx.conf здесь СОЗНАТЕЛЬНО не
    # подключается, а его содержимое расписано ниже вручную.
    #
    # Причина: ssl_protocols в nginx — это набор флагов, а не значение.
    # Вторая такая строка в том же блоке не заменяет первую, а
    # ДОБАВЛЯЕТСЯ к ней. Файл Let's Encrypt задаёт «TLSv1.2 TLSv1.3»,
    # и написанная после него строка «ssl_protocols TLSv1.2;» ничего не
    # отключает — TLS 1.3 остаётся включённым, а nginx лишь предупреждает
    # «duplicate value TLSv1.2». Убрать версию можно только там, где она
    # назначается, поэтому include заменён на явные настройки.
    #
    # ВРЕМЕННО, пока действуют правила фильтрации ТСПУ (с августа 2026).
    # Приветствие браузера по TLS 1.3 не помещается в один сетевой пакет.
    # Оборудование фильтрации разбирает первый пакет, а продолжение
    # отбрасывает — сервер получает половину приветствия и молча ждёт
    # остаток. Снаружи это выглядит как «сайт не открывается».
    # Приветствие по TLS 1.2 втрое меньше, влезает целиком и проходит.
    #
    # Когда правила изменятся — вернуть TLSv1.3 в строку ниже: он
    # устанавливает соединение быстрее. Разбор в DEPLOY.md, «РАЗГАДКА».
    ssl_protocols TLSv1.2;

    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;

    # Форма экспресс-разбора принимает файл выгрузки. По умолчанию nginx
    # рубит запросы больше 1 МБ ответом 413, и посетитель видит ошибку
    # вместо отправленной заявки.
    client_max_body_size 10m;

    # Статика и медиа отдаёт nginx напрямую, минуя Django.
    location /static/ {
        alias /var/www/s-poryadok/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/s-poryadok/media/;
        access_log off;
        expires 7d;
    }

    # Иконки, которые браузеры просят по корню сайта, минуя разметку.
    # Отдаём файлы напрямую: Django не дёргается, а иконка у сайта есть.
    # Возвращать здесь 204 нельзя — тогда вкладка остаётся без значка.
    location = /favicon.ico {
        alias /var/www/s-poryadok/staticfiles/landing/img/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location ~* ^/apple-touch-icon.*\.png$ {
        alias /var/www/s-poryadok/staticfiles/landing/img/apple-touch-icon.png;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # Основное проксирование в gunicorn
    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;

        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

# ── 2. HTTP: перенаправление на HTTPS ────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    server_name s-poryadok.ru www.s-poryadok.ru;

    # Продление сертификата ходит по обычному HTTP и не должно попадать
    # под перенаправление, иначе в октябре сертификат просто не
    # обновится и сайт встанет с ошибкой безопасности.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 3. Всё остальное: чужие домены и заходы по IP ────────────────────
# Боты постоянно стучатся по адресу сервера с чужим именем в запросе.
# Пусть получают отказ, не доходя до Django.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
